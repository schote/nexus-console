site_name: Nexus Console
site_description: Open-source Python framework for versatile low-field MRI acquisition
site_url: https://schote.github.io/nexus-console/
repo_url: https://github.com/schote/nexus-console
repo_name: schote/nexus-console
edit_uri: ""

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.ico
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - toc.follow
    - search.suggest
    - search.highlight

extra_css:
  - assets/stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - assets/js/doc-badges.js

plugins:
  - search
  - gen-files:
      scripts:
        - docs/scripts/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          inventories:
            - https://docs.python.org/3/objects.inv
            - https://numpy.org/doc/stable/objects.inv
            - https://docs.pydantic.dev/latest/objects.inv
          options:
            docstring_style: numpy
            docstring_options:
              warn_unknown_params: false
            docstring_section_style: list
            show_docstring_modules: false
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            separate_signature: true
            merge_init_into_class: true
            show_signature_annotations: true
            signature_crossrefs: true
            unwrap_annotated: true
            filters:
              - "!^_"

nav:
  - Home: index.md
  - Getting started:
    - Quickstart: getting-started/quickstart.md
    - First acquisition: getting-started/first-acquisition.md
  - System guide:
    - Overview: system/overview.md
    - Hardware: system/hardware.md
    - Wiring: system/wiring.md
    - Device configuration: system/configuration.md
    - Sequence unrolling: system/sequence-unrolling.md
    - Acquisition: system/acquisition.md
    - Signal flow: system/signal-flow.md
  - Examples:
    - Overview: examples/index.md
    - Spin-echo spectrum: examples/spin_echo.md
    - T2 relaxation: examples/t2_measurement.md
    - 3D turbo spin-echo: examples/tse_3d.md
    - Remote acquisition: examples/remote_acquisition.md
  - API reference: reference/
  - References: references.md

docs_dir: docs
site_dir: site

extra:
  version:
    provider: mike
