name: 'Static Tests'

on:
  pull_request:

jobs:
  linting:

  
    runs-on: ubuntu-latest
  
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: '3.13'
        enable-cache: true

    - name: Install dependencies
      run: uv sync --locked --no-default-groups --group lint

    - name: Run ruff check
      run: uv run ruff check

    - name: Run mypy
      run: uv run mypy src


    
