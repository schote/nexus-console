name: Build and Deploy

on:
  push:
    branches:
      - "**"  # Match all branches, excludes tag pushes

permissions:
  contents: write

jobs:
  # Step 1: Build and upload package, runs on any git push
  build-package:
    name: Build package and upload artifact
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for full Git history and tags

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install build tools
        run: |
          python -m pip install --upgrade build setuptools-git-versioning

      - name: Get version
        id: get_version
        run: |
          VERSION=$(python -c "import setuptools_git_versioning; print(setuptools_git_versioning.get_version())")
          echo "VERSION=$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "$VERSION" > src/console/VERSION

      - name: Commit updated VERSION file (if changed)
        run: |
          if ! git diff --quiet src/console/VERSION; then
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add src/console/VERSION
            git commit -m "Update version file to ${{ steps.get_version.outputs.version }}"
            git push origin HEAD
          fi

      - name: Build package
        run: python -m build

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-console-dist
          path: dist/

  # Step 2: Tag and Publish to PyPI, only runs on main
  publish:
    name: Tag and publish package to PyPI
    runs-on: ubuntu-latest
    needs: build-package
    if: github.ref == 'refs/heads/main' && needs.build-package.outputs.version != ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: nexus-console-dist
          path: dist/

      - name: Check if Git tag already exists
        id: check_tag
        run: |
          if git rev-parse "v${{ needs.build-package.outputs.version }}" >/dev/null 2>&1; then
            echo "Tag already exists"
            echo "tag_exists=true" >> $GITHUB_OUTPUT
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT

      - name: Create and push Git tag
        if: steps.check_tag.outputs.tag_exists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag v${{ needs.build-package.outputs.version }}
          git push origin v${{ needs.build-package.outputs.version }}

      - name: Publish to PyPI
        if: steps.check_tag.outputs.tag_exists == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}